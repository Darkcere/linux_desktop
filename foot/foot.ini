shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=e2e2e8
alpha=0.8
selection-foreground=ffffff

cursor=111318 a6c8ff

# Normal ANSI
regular0=002f5c
regular1=ffb4ab
regular2=e17ffd
regular3=b6c7e6
regular4=a6c8ff
regular5=edb1fe
regular6=b6c7e6
regular7=e2e2e8

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=edb1fe
bright3=b6c7e6
bright4=a6c8ff
bright5=edb1fe
bright6=b6c7e6

dim-blend-towards=black