shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=e1e2e6
alpha=0.8
selection-foreground=ffffff

cursor=111416 94cdf6

# Normal ANSI
regular0=00324b
regular1=ffb4ab
regular2=d48bec
regular3=b4c9db
regular4=94cdf6
regular5=e4b7f3
regular6=b4c9db
regular7=e1e2e6

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=e4b7f3
bright3=b4c9db
bright4=94cdf6
bright5=e4b7f3
bright6=b4c9db

dim-blend-towards=black