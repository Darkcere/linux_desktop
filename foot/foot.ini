shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=eedfdb
alpha=0.8
selection-foreground=000000

cursor=19120f ffb598

# Normal ANSI
regular0=541e04
regular1=ffb4ab
regular2=c5bc46
regular3=ecbca9
regular4=ffb598
regular5=d1ca6d
regular6=ecbca9
regular7=eedfdb

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=d1ca6d
bright3=ecbca9
bright4=ffb598
bright5=d1ca6d
bright6=ecbca9

dim-blend-towards=black