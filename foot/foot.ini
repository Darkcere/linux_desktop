shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=e4e2e4
alpha=0.8
selection-foreground=ffffff

cursor=131315 bfc5e6

# Normal ANSI
regular0=272e47
regular1=ffb4ab
regular2=d099c1
regular3=c4c5d4
regular4=bfc5e6
regular5=e0bcd6
regular6=c4c5d4
regular7=e4e2e4

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=e0bcd6
bright3=c4c5d4
bright4=bfc5e6
bright5=e0bcd6
bright6=c4c5d4

dim-blend-towards=black