shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=ece0e2
alpha=0.8
selection-foreground=4b1731

cursor=171214 ffcfe0

# Normal ANSI
regular0=521e37
regular1=ffb4ab
regular2=ffaf8d
regular3=e3bcca
regular4=ffcfe0
regular5=ffd3c0
regular6=e3bcca
regular7=ece0e2

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=ffd3c0
bright3=e3bcca
bright4=ffcfe0
bright5=ffd3c0
bright6=e3bcca

dim-blend-towards=black