shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=e5e1e7
alpha=0.8
selection-foreground=ffffff

cursor=141317 c7bfff

# Normal ANSI
regular0=2d275c
regular1=ffb4ab
regular2=f284c7
regular3=c8c3df
regular4=c7bfff
regular5=f7b2dc
regular6=c8c3df
regular7=e5e1e7

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=f7b2dc
bright3=c8c3df
bright4=c7bfff
bright5=f7b2dc
bright6=c8c3df

dim-blend-towards=black