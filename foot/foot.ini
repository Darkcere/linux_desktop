shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=f0ddeb
alpha=0.8
selection-foreground=ffffff

cursor=1a1019 ffa9fb

# Normal ANSI
regular0=57005d
regular1=ffb4ab
regular2=ff7e9a
regular3=ffa9fb
regular4=ffa9fb
regular5=ffb1c2
regular6=ffa9fb
regular7=f0ddeb

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=ffb1c2
bright3=ffa9fb
bright4=ffa9fb
bright5=ffb1c2
bright6=ffa9fb

dim-blend-towards=black