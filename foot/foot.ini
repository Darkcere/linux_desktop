shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=f6dddd
alpha=0.8
selection-foreground=000000

cursor=1c1011 ffb3b5

# Normal ANSI
regular0=650018
regular1=ffb4ab
regular2=ff9b48
regular3=ffb3b5
regular4=ffb3b5
regular5=ffb77b
regular6=ffb3b5
regular7=f6dddd

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=ffb77b
bright3=ffb3b5
bright4=ffb3b5
bright5=ffb77b
bright6=ffb3b5

dim-blend-towards=black