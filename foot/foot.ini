shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=e6e2df
alpha=0.8
selection-foreground=000000

cursor=141312 cfc5b5

# Normal ANSI
regular0=342e23
regular1=ffb4ab
regular2=aeb19f
regular3=ccc5be
regular4=cfc5b5
regular5=c6c8bb
regular6=ccc5be
regular7=e6e2df

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=c6c8bb
bright3=ccc5be
bright4=cfc5b5
bright5=c6c8bb
bright6=ccc5be

dim-blend-towards=black