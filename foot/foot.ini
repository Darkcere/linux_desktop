shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=ece0e0
alpha=0.8
selection-foreground=000000

cursor=171213 fdb2c1

# Normal ANSI
regular0=4f1f2c
regular1=ffb4ab
regular2=efa351
regular3=e3bdc3
regular4=fdb2c1
regular5=f3bc80
regular6=e3bdc3
regular7=ece0e0

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=f3bc80
bright3=e3bdc3
bright4=fdb2c1
bright5=f3bc80
bright6=e3bdc3

dim-blend-towards=black