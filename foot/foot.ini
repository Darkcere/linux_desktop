shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[colors-dark]
foreground=e5e1e6
alpha=0.8
selection-foreground=ffffff

cursor=131316 c1c1fc

# Normal ANSI
regular0=28295a
regular1=ffb4ab
regular2=ec87cb
regular3=c6c4de
regular4=c1c1fc
regular5=f3b3de
regular6=c6c4de
regular7=e5e1e6

# Bright ANSI
bright0=808080
bright1=ffb4ab
bright2=f3b3de
bright3=c6c4de
bright4=c1c1fc
bright5=f3b3de
bright6=c6c4de

dim-blend-towards=black