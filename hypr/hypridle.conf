general {
    # 💡 1. Triggers Quickshell, creates a persistent state file, and traps Hyprland shortcuts
    lock_cmd = touch /tmp/qs_locked && touch /tmp/qs_is_locked && hyprctl dispatch submap locked
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 120
    # 💡 2. Checks if our Quickshell lock file exists instead of checking for hyprlock
    on-timeout = [ -f /tmp/qs_is_locked ] && hyprctl dispatch dpms off 
    on-resume = [ -f /tmp/qs_is_locked ] && hyprctl dispatch dpms on
}

listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 900                                 # 15min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1000                                # 16 min
    on-timeout = systemctl suspend                # suspend pc
}
